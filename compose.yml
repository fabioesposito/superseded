services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superseded}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-superseded}
    volumes:
      - superseded-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superseded}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPERSEDED_DATABASE_URL: postgres://${POSTGRES_USER:-superseded}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-superseded}
      SUPERSEDED_APP_ID: ${SUPERSEDED_APP_ID:?set SUPERSEDED_APP_ID in .env}
      SUPERSEDED_WEBHOOK_SECRET: ${SUPERSEDED_WEBHOOK_SECRET:?set SUPERSEDED_WEBHOOK_SECRET in .env}
      SUPERSEDED_PRIVATE_KEY_PATH: /keys/private-key.pem
      SUPERSEDED_HOST: "0.0.0.0"
      SUPERSEDED_PORT: "8000"
      # The server binds 0.0.0.0. Terminate TLS at a reverse proxy you run in
      # front of this service (the default) OR mount certs and set
      # SUPERSEDED_TLS_CERT / SUPERSEDED_TLS_KEY + SUPERSEDED_BEHIND_PROXY=0.
      # Do NOT publish port 8000 directly without TLS: the bearer API key and
      # webhook signatures would traverse cleartext.
      SUPERSEDED_BEHIND_PROXY: ${SUPERSEDED_BEHIND_PROXY:-1}
      # The server calls the DeepSeek API directly over the network — no local
      # agent execution, so no sandbox is needed. Set the key in the host
      # environment: SUPERSEDED_DEEPSEEK_API_KEY=... docker compose up
      SUPERSEDED_DEEPSEEK_API_KEY: ${SUPERSEDED_DEEPSEEK_API_KEY:-}
      SUPERSEDED_LOG_FORMAT: json
      SUPERSEDED_LOG_LEVEL: ${SUPERSEDED_LOG_LEVEL:-info}
      SUPERSEDED_SERVER_MODEL: ${SUPERSEDED_SERVER_MODEL:-}
    volumes:
      - ./keys:/keys:ro
      - superseded-tmp:/tmp/superseded

volumes:
  superseded-pgdata:
  superseded-tmp:

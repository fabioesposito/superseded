# Alembic dev config. The runtime path (alembic_runner) builds its own Config
# programmatically and never reads this file. This file exists so developers
# can run: uv run alembic upgrade head / uv run alembic revision --autogenerate.
[alembic]
script_location = src/superseded/memory/migrations
sqlalchemy.url = sqlite+aiosqlite:///.superseded/dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

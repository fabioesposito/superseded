<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" shape-rendering="crispEdges">
  <defs>
    <!-- Shield clip path for colored stripes -->
    <clipPath id="shieldClip">
      <polygon points="
        120,2
        110,10 100,18 90,26 80,36
        80,78
        90,86 100,94 110,102 120,110
        130,102 140,94 150,86 160,78
        160,36
        150,26 140,18 130,10
      "/>
    </clipPath>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon glow for shield outline -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ====== Shield Symbol ====== -->

  <g filter="url(#dropShadow)">
    <!-- Background fill -->
    <polygon points="
      120,2
      110,10 100,18 90,26 80,36
      80,78
      90,86 100,94 110,102 120,110
      130,102 140,94 150,86 160,78
      160,36
      150,26 140,18 130,10
    " fill="#0a0a18"/>

    <!-- 5 colored vertical stripes clipped to shield -->
    <g clip-path="url(#shieldClip)">
      <!-- Security - Red -->
      <rect x="82" y="0" width="14" height="120" fill="#ff4466" opacity="0.9"/>
      <!-- Correctness - Orange -->
      <rect x="96" y="0" width="14" height="120" fill="#ff8833" opacity="0.9"/>
      <!-- Performance - Yellow -->
      <rect x="110" y="0" width="14" height="120" fill="#ffd700" opacity="0.9"/>
      <!-- Style - Green -->
      <rect x="124" y="0" width="14" height="120" fill="#00ff41" opacity="0.9"/>
      <!-- Architecture - Cyan -->
      <rect x="138" y="0" width="14" height="120" fill="#00f0ff" opacity="0.9"/>

      <!-- Subtle horizontal scanlines inside shield -->
      <g opacity="0.15">
        <line x1="70" y1="40" x2="170" y2="40" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="46" x2="170" y2="46" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="52" x2="170" y2="52" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="58" x2="170" y2="58" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="64" x2="170" y2="64" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="70" x2="170" y2="70" stroke="#fff" stroke-width="2"/>
        <line x1="70" y1="76" x2="170" y2="76" stroke="#fff" stroke-width="2"/>
      </g>
    </g>

    <!-- Shield outline -->
    <polygon points="
      120,2
      110,10 100,18 90,26 80,36
      80,78
      90,86 100,94 110,102 120,110
      130,102 140,94 150,86 160,78
      160,36
      150,26 140,18 130,10
    " fill="none" stroke="#e8e8f0" stroke-width="2.5" stroke-linejoin="miter" filter="url(#neonGlow)"/>

    <!-- Pixel-art corner accents -->
    <!-- Top-left notch -->
    <rect x="77" y="16" width="6" height="6" fill="#e8e8f0"/>
    <rect x="83" y="10" width="6" height="6" fill="#e8e8f0"/>
    <!-- Top-right notch -->
    <rect x="157" y="16" width="6" height="6" fill="#e8e8f0"/>
    <rect x="151" y="10" width="6" height="6" fill="#e8e8f0"/>
    <!-- Bottom-left notch -->
    <rect x="77" y="98" width="6" height="6" fill="#e8e8f0"/>
    <rect x="83" y="104" width="6" height="6" fill="#e8e8f0"/>
    <!-- Bottom-right notch -->
    <rect x="157" y="98" width="6" height="6" fill="#e8e8f0"/>
    <rect x="151" y="104" width="6" height="6" fill="#e8e8f0"/>

    <!-- Center code bracket symbol inside shield -->
    <g transform="translate(120, 56)" opacity="0.85" filter="url(#glow)">
      <!-- Left bracket -->
      <rect x="-12" y="-16" width="4" height="4" fill="#fff"/>
      <rect x="-12" y="-12" width="4" height="4" fill="#fff"/>
      <rect x="-12" y="-8"  width="4" height="4" fill="#fff"/>
      <rect x="-12" y="-4"  width="4" height="4" fill="#fff"/>
      <rect x="-8"  y="-16" width="4" height="4" fill="#fff"/>
      <rect x="-8"  y="12"  width="4" height="4" fill="#fff"/>
      <rect x="-12" y="0"   width="4" height="4" fill="#fff"/>
      <rect x="-12" y="4"   width="4" height="4" fill="#fff"/>
      <rect x="-12" y="8"   width="4" height="4" fill="#fff"/>
      <rect x="-12" y="12"  width="4" height="4" fill="#fff"/>

      <!-- Slash -->
      <rect x="0"  y="-16" width="4" height="4" fill="#fff"/>
      <rect x="0"  y="-12" width="4" height="4" fill="#fff"/>
      <rect x="-4" y="-8"  width="4" height="4" fill="#fff"/>
      <rect x="-4" y="-4"  width="4" height="4" fill="#fff"/>
      <rect x="-4" y="0"   width="4" height="4" fill="#fff"/>
      <rect x="-4" y="4"   width="4" height="4" fill="#fff"/>
      <rect x="-4" y="8"   width="4" height="4" fill="#fff"/>
      <rect x="0"  y="12"  width="4" height="4" fill="#fff"/>
      <rect x="0"  y="16"  width="4" height="4" fill="#fff"/>

      <!-- Right bracket -->
      <rect x="8"  y="-16" width="4" height="4" fill="#fff"/>
      <rect x="12" y="-16" width="4" height="4" fill="#fff"/>
      <rect x="8"  y="12"  width="4" height="4" fill="#fff"/>
      <rect x="12" y="-12" width="4" height="4" fill="#fff"/>
      <rect x="12" y="-8"  width="4" height="4" fill="#fff"/>
      <rect x="12" y="-4"  width="4" height="4" fill="#fff"/>
      <rect x="12" y="0"   width="4" height="4" fill="#fff"/>
      <rect x="12" y="4"   width="4" height="4" fill="#fff"/>
      <rect x="12" y="8"   width="4" height="4" fill="#fff"/>
      <rect x="12" y="12"  width="4" height="4" fill="#fff"/>
    </g>
  </g>

  <!-- ====== Wordmark ====== -->

  <!-- SUPERSEDED - pixel-art style text built with rects -->
  <g fill="#e8e8f0" filter="url(#dropShadow)">

    <!-- S -->
    <rect x="44" y="130" width="4" height="4"/><rect x="48" y="130" width="4" height="4"/><rect x="52" y="130" width="4" height="4"/>
    <rect x="40" y="134" width="4" height="4"/>
    <rect x="44" y="138" width="4" height="4"/><rect x="48" y="138" width="4" height="4"/><rect x="52" y="138" width="4" height="4"/>
    <rect x="56" y="142" width="4" height="4"/>
    <rect x="40" y="146" width="4" height="4"/><rect x="44" y="146" width="4" height="4"/><rect x="48" y="146" width="4" height="4"/><rect x="52" y="146" width="4" height="4"/>

    <!-- U -->
    <rect x="64" y="130" width="4" height="4"/><rect x="72" y="130" width="4" height="4"/>
    <rect x="64" y="134" width="4" height="4"/><rect x="72" y="134" width="4" height="4"/>
    <rect x="64" y="138" width="4" height="4"/><rect x="72" y="138" width="4" height="4"/>
    <rect x="64" y="142" width="4" height="4"/><rect x="72" y="142" width="4" height="4"/>
    <rect x="68" y="146" width="4" height="4"/>

    <!-- P -->
    <rect x="80" y="130" width="4" height="4"/><rect x="84" y="130" width="4" height="4"/><rect x="88" y="130" width="4" height="4"/>
    <rect x="80" y="134" width="4" height="4"/><rect x="88" y="134" width="4" height="4"/>
    <rect x="80" y="138" width="4" height="4"/><rect x="84" y="138" width="4" height="4"/><rect x="88" y="138" width="4" height="4"/>
    <rect x="80" y="142" width="4" height="4"/>
    <rect x="80" y="146" width="4" height="4"/>

    <!-- E -->
    <rect x="96" y="130" width="4" height="4"/><rect x="100" y="130" width="4" height="4"/><rect x="104" y="130" width="4" height="4"/>
    <rect x="96" y="134" width="4" height="4"/>
    <rect x="96" y="138" width="4" height="4"/><rect x="100" y="138" width="4" height="4"/><rect x="104" y="138" width="4" height="4"/>
    <rect x="96" y="142" width="4" height="4"/>
    <rect x="96" y="146" width="4" height="4"/><rect x="100" y="146" width="4" height="4"/><rect x="104" y="146" width="4" height="4"/>

    <!-- R -->
    <rect x="112" y="130" width="4" height="4"/><rect x="116" y="130" width="4" height="4"/><rect x="120" y="130" width="4" height="4"/>
    <rect x="112" y="134" width="4" height="4"/><rect x="120" y="134" width="4" height="4"/>
    <rect x="112" y="138" width="4" height="4"/><rect x="116" y="138" width="4" height="4"/><rect x="120" y="138" width="4" height="4"/>
    <rect x="112" y="142" width="4" height="4"/><rect x="116" y="142" width="4" height="4"/>
    <rect x="112" y="146" width="4" height="4"/><rect x="120" y="146" width="4" height="4"/>

    <!-- S -->
    <rect x="128" y="130" width="4" height="4"/><rect x="132" y="130" width="4" height="4"/><rect x="136" y="130" width="4" height="4"/>
    <rect x="128" y="134" width="4" height="4"/>
    <rect x="128" y="138" width="4" height="4"/><rect x="132" y="138" width="4" height="4"/><rect x="136" y="138" width="4" height="4"/>
    <rect x="140" y="142" width="4" height="4"/>
    <rect x="128" y="146" width="4" height="4"/><rect x="132" y="146" width="4" height="4"/><rect x="136" y="146" width="4" height="4"/>

    <!-- E -->
    <rect x="148" y="130" width="4" height="4"/><rect x="152" y="130" width="4" height="4"/><rect x="156" y="130" width="4" height="4"/>
    <rect x="148" y="134" width="4" height="4"/>
    <rect x="148" y="138" width="4" height="4"/><rect x="152" y="138" width="4" height="4"/><rect x="156" y="138" width="4" height="4"/>
    <rect x="148" y="142" width="4" height="4"/>
    <rect x="148" y="146" width="4" height="4"/><rect x="152" y="146" width="4" height="4"/><rect x="156" y="146" width="4" height="4"/>

    <!-- D -->
    <rect x="164" y="130" width="4" height="4"/><rect x="168" y="130" width="4" height="4"/>
    <rect x="164" y="134" width="4" height="4"/><rect x="172" y="134" width="4" height="4"/>
    <rect x="164" y="138" width="4" height="4"/><rect x="172" y="138" width="4" height="4"/>
    <rect x="164" y="142" width="4" height="4"/><rect x="172" y="142" width="4" height="4"/>
    <rect x="164" y="146" width="4" height="4"/><rect x="168" y="146" width="4" height="4"/>

    <!-- E -->
    <rect x="180" y="130" width="4" height="4"/><rect x="184" y="130" width="4" height="4"/><rect x="188" y="130" width="4" height="4"/>
    <rect x="180" y="134" width="4" height="4"/>
    <rect x="180" y="138" width="4" height="4"/><rect x="184" y="138" width="4" height="4"/><rect x="188" y="138" width="4" height="4"/>
    <rect x="180" y="142" width="4" height="4"/>
    <rect x="180" y="146" width="4" height="4"/><rect x="184" y="146" width="4" height="4"/><rect x="188" y="146" width="4" height="4"/>

    <!-- D -->
    <rect x="196" y="130" width="4" height="4"/><rect x="200" y="130" width="4" height="4"/>
    <rect x="196" y="134" width="4" height="4"/><rect x="204" y="134" width="4" height="4"/>
    <rect x="196" y="138" width="4" height="4"/><rect x="204" y="138" width="4" height="4"/>
    <rect x="196" y="142" width="4" height="4"/><rect x="204" y="142" width="4" height="4"/>
    <rect x="196" y="146" width="4" height="4"/><rect x="200" y="146" width="4" height="4"/>

    <!-- Accent dots under wordmark -->
    <g opacity="0.6">
      <circle cx="48" cy="158" r="1.5" fill="#ff4466"/>
      <circle cx="60" cy="158" r="1.5" fill="#ff8833"/>
      <circle cx="72" cy="158" r="1.5" fill="#ffd700"/>
      <circle cx="84" cy="158" r="1.5" fill="#00ff41"/>
      <circle cx="96" cy="158" r="1.5" fill="#00f0ff"/>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="120" y="174" text-anchor="middle" font-family="monospace" font-size="7" fill="#555580" letter-spacing="3">AI CODE REVIEW</text>

</svg>

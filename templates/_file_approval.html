<div id="file-approval">
    {% if changed_files %}
    <div class="card rounded-xl p-5 mb-4">
        <h3 class="font-semibold text-shell-100 mb-3 text-sm uppercase tracking-wider">Changed Files</h3>
        <div class="space-y-2">
            {% for file in changed_files %}
            <div class="flex items-center justify-between gap-3 px-3 py-2 rounded-lg bg-shell-900/50 border border-shell-800/30">
                <span class="text-sm font-mono text-shell-200">{{ file }}</span>
                <div class="flex gap-2">
                    {% if file in approved_files %}
                    <span class="text-xs text-olive-400 font-semibold">Approved</span>
                    {% else %}
                    <button hx-post="/issues/{{ issue.id }}/approve-file"
                            hx-include="[name='filename']"
                            hx-target="#file-approval"
                            hx-swap="outerHTML"
                            class="text-xs px-3 py-1 rounded bg-olive-900/40 text-olive-400 hover:bg-olive-900/60 transition-colors font-semibold">
                        Approve
                    </button>
                    <button hx-post="/issues/{{ issue.id }}/reject-file"
                            hx-include="[name='filename']"
                            hx-target="#file-approval"
                            hx-swap="outerHTML"
                            class="text-xs px-3 py-1 rounded bg-coral-900/40 text-coral-400 hover:bg-coral-900/60 transition-colors font-semibold">
                        Reject
                    </button>
                    {% endif %}
                    <input type="hidden" name="filename" value="{{ file }}">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>

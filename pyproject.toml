[project]
name = "superseded"
version = "0.2.0"
description = "Reviews that supersede themselves."
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
graph = ["code-review-graph"]
sandbox = [
    "smolmachines>=1.4.5",
]

[project.scripts]
superseded = "superseded.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superseded"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires a live Postgres (set SUPERSEDED_POSTGRES_TEST_DSN)",
]
addopts = "-m 'not postgres'"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/superseded/memory/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "TC001", "TC002", "TC003", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["superseded"]

[tool.ruff.format]
quote-style = "double"
